<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0E16">
<title>Prismo Escala</title>
<style>
:root{
  --bg:#0A0E16;--s1:#101726;--s2:#161F31;--s3:#1E2940;--bd:#233049;
  --tx:#EAF0FA;--mu:#8C98AE;--mu2:#5B677D;
  --pri:#6D7CFF;--pri2:#8B5CF6;
  --trab:#3B82F6;--trab2:#6366F1;
  --ok:#22C55E;--srv:#F59E0B;--med:#EC4899;--cmp:#14B8A6;--out:#A78BFA;
  --fer:#F87171;--warn:#FBBF24;--r:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.35;overscroll-behavior:none}
body{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + var(--safe-b))}
/* topo */
.topo{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 10px}
.topo h1{font-size:22px;font-weight:750;letter-spacing:-.3px}
.topo .sub{color:var(--mu);font-size:13px;margin-top:2px}
.btn-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--bd)}
.btn-ic:active{transform:scale(.95)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:16px 18px;margin-bottom:14px;
  background:radial-gradient(120% 140% at 100% 0%,rgba(139,92,246,.45),transparent 55%),linear-gradient(135deg,#1D2B55,#162040 60%,#121A2E);
  border:1px solid rgba(109,124,255,.3)}
.hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:#AFC0FF;font-weight:650;display:flex;align-items:center;gap:6px}
.hero .big{font-size:24px;font-weight:780;margin-top:6px;letter-spacing:-.4px}
.hero .meta{color:#C9D3EE;margin-top:3px;font-size:14px}
.hero .cnt{position:absolute;right:16px;top:16px;text-align:right}
.hero .cnt b{display:block;font-size:20px;font-weight:780}
.hero .cnt span{font-size:11px;color:#AFC0FF;text-transform:uppercase;letter-spacing:1px}
.hero .sono{display:flex;gap:8px;align-items:center;margin-top:12px;padding:9px 11px;border-radius:12px;background:rgba(10,14,22,.45);font-size:13px;color:#DCE3F5}
.hero .sono svg{color:#FBBF24}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#22C55E,#86EFAC)}
.dot-live{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
/* calendário */
.cal{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:12px 10px 10px}
.mes{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.mes h2{font-size:18px;font-weight:720}
.mes h2 small{color:var(--mu);font-weight:500;margin-left:6px}
.mes .nav{display:flex;gap:6px;align-items:center}
.chip-hoje{font-size:13px;font-weight:650;padding:7px 12px;border-radius:10px;background:var(--s3);color:#C7D0FF}
.sem{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--mu2);font-weight:700;padding-bottom:6px;letter-spacing:.5px}
.grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;touch-action:pan-y}
.cel{position:relative;aspect-ratio:1/1.12;border-radius:12px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;overflow:hidden;transition:transform .12s}
.cel:active{transform:scale(.94)}
.cel .n{font-size:15px;font-weight:650}
.cel .hr{font-size:9.5px;font-weight:650;opacity:.92;margin-top:1px;white-space:nowrap}
.cel .dots{position:absolute;bottom:5px;display:flex;gap:3px}
.cel .dots i{width:5px;height:5px;border-radius:50%}
.cel.trab{background:linear-gradient(160deg,var(--trab),var(--trab2));color:#fff;box-shadow:0 4px 14px -6px rgba(59,130,246,.7)}
.cel.trab.esp{background:linear-gradient(160deg,#8B5CF6,#6D28D9)}
.cel.pass{opacity:.55}
.cel.pass .n{font-weight:560}
.cel.trab.pass{background:linear-gradient(160deg,#2A3A5E,#2C3160);box-shadow:none;color:#B8C2DA;opacity:.8}
.cel.trab.esp.pass{background:linear-gradient(160deg,#352F5E,#2F2A55)}
.cel.fora{opacity:.32}
.cel.hoje{outline:2px solid #fff;outline-offset:-2px}
.cel.sel:not(.hoje){outline:2px solid var(--pri);outline-offset:-2px}
.cel.fer .n{color:var(--fer)}
.cel.trab.fer .n{color:#FFE4E4}
.cel .mk{position:absolute;top:0;right:0;width:0;height:0;border-left:11px solid transparent;border-top:11px solid var(--warn)}
.cel .mud{position:absolute;top:4px;left:4px;width:6px;height:6px;border-radius:50%;background:#34D399;box-shadow:0 0 0 2px rgba(52,211,153,.3)}
.leg{display:flex;flex-wrap:wrap;gap:10px 14px;padding:10px 4px 2px;font-size:11.5px;color:var(--mu)}
.leg span{display:flex;align-items:center;gap:5px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:18px;font-weight:760}
.kpi span{font-size:11.5px;color:var(--mu)}
/* painel do dia */
.dia-h{display:flex;align-items:flex-end;justify-content:space-between;margin:18px 2px 10px}
.dia-h h3{font-size:17px;font-weight:720}
.dia-h small{color:var(--mu);font-size:12.5px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.st{display:flex;gap:12px;align-items:center}
.st .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.st .ico.t{background:linear-gradient(160deg,var(--trab),var(--trab2));color:#fff}
.st .ico.f{background:rgba(34,197,94,.14);color:#4ADE80}
.st .ico.n{background:var(--s3);color:var(--mu)}
.st b{font-size:16px;font-weight:720;display:block}
.st .m{color:var(--mu);font-size:13.5px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:8px;background:var(--s3);color:#C6D0E6}
.tag.w{background:rgba(251,191,36,.14);color:#FCD34D}
.tag.r{background:rgba(248,113,113,.14);color:#FCA5A5}
.tag.p{background:rgba(139,92,246,.18);color:#C4B5FD}
.tag.g{background:rgba(34,197,94,.14);color:#86EFAC}
.ev{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--s1);border:1px solid var(--bd);margin-top:8px;width:100%;text-align:left}
.ev:active{background:var(--s2)}
.ev .bar-l{width:4px;align-self:stretch;border-radius:4px;flex:none}
.ev .t{font-weight:680}
.ev .m{color:var(--mu);font-size:12.5px;margin-top:2px}
.ev .v{margin-left:auto;text-align:right;font-weight:700;font-size:13.5px;white-space:nowrap}
.ev .v small{display:block;font-size:11px;font-weight:600}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 14px;border-radius:14px;font-weight:680;background:var(--s2);border:1px solid var(--bd)}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));border:0;color:#fff;box-shadow:0 8px 20px -10px rgba(109,124,255,.9)}
.btn.dan{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:#FCA5A5}
.btn.full{grid-column:1/-1;width:100%}
.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:11px}
/* agenda */
.filtros{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.fch{flex:none;padding:8px 14px;border-radius:999px;background:var(--s2);border:1px solid var(--bd);font-size:13.5px;font-weight:620;color:var(--mu)}
.fch.on{background:#E9EDFF;color:#1B2140;border-color:#E9EDFF}
.grp{margin-bottom:14px}
.grp-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 6px}
.grp-h b{font-size:14.5px}
.grp-h span{color:var(--mu);font-size:12.5px}
.linha{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--s1);border:1px solid var(--bd);margin-bottom:6px;width:100%;text-align:left}
.linha .q{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.linha .t{font-weight:660}
.linha .m{color:var(--mu);font-size:12.5px;margin-top:1px}
.vazio{text-align:center;color:var(--mu);padding:40px 20px}
.vazio svg{width:42px;height:42px;opacity:.5;margin-bottom:10px}
/* resumo */
.big-card{border-radius:22px;padding:18px;background:linear-gradient(135deg,#13203F,#1A1640);border:1px solid rgba(109,124,255,.25);margin-bottom:12px}
.big-card .l{color:#AFC0FF;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;font-weight:650}
.big-card .v{font-size:34px;font-weight:800;letter-spacing:-.8px;margin-top:4px}
.big-card .c{color:#C9D3EE;font-size:13.5px;margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mini{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px}
.mini .l{color:var(--mu);font-size:12px;display:flex;align-items:center;gap:6px}
.mini .v{font-size:22px;font-weight:770;margin-top:6px}
.sec-t{font-size:13px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:20px 4px 8px}
.semana-bar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sb{text-align:center;font-size:11px;color:var(--mu)}
.sb i{display:block;height:64px;border-radius:10px;background:var(--s2);margin-bottom:4px;position:relative;overflow:hidden}
.sb i em{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--trab),var(--trab2));border-radius:10px}
/* ajustes */
.lista{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--bd);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .tx{flex:1;min-width:0}
.item .tx b{font-weight:640;display:block}
.item .tx small{color:var(--mu);font-size:12.5px;display:block;margin-top:2px}
.item .q{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--s3);color:#C7D0FF;flex:none}
.item select{background:var(--s3);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;max-width:130px}
.item input[type=time]{background:var(--s3);border:1px solid var(--bd);border-radius:10px;padding:7px 8px}
.ok-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.ok-dot.no{background:var(--fer)}
.sw{position:relative;width:48px;height:28px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--s3);border:1px solid var(--bd);transition:.2s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#94A0B8;transition:.2s}
.sw input:checked+span{background:var(--pri);border-color:var(--pri)}
.sw input:checked+span:after{transform:translateX(20px);background:#fff}
.hist{position:relative;padding-left:18px}
.hist:before{content:"";position:absolute;left:5px;top:20px;bottom:20px;width:2px;background:var(--bd)}
.hist .item{position:relative}
.hist .item:before{content:"";position:absolute;left:-17px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--mu2);border:2px solid var(--bg)}
.hist .item.atual:before{background:var(--ok)}
/* checklist */
.ck-hero{display:flex;gap:16px;align-items:center;border-radius:22px;padding:16px 18px;margin-bottom:14px;background:radial-gradient(120% 140% at 100% 0%,rgba(34,197,94,.28),transparent 55%),linear-gradient(135deg,#15233F,#131B30);border:1px solid rgba(109,124,255,.25)}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:url(#gradRing);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:800}
.ck-hero .t{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:#AFC0FF;font-weight:650}
.ck-hero .v{font-size:20px;font-weight:780;margin-top:3px}
.ck-hero .m{color:#C9D3EE;font-size:13.5px;margin-top:2px}
.ck-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:5px;margin-bottom:12px}
.ck-tabs button{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 8px;border-radius:12px;font-weight:680;color:var(--mu);font-size:14px}
.ck-tabs button.on{background:var(--s3);color:var(--tx);box-shadow:0 4px 14px -8px rgba(0,0,0,.8)}
.ck-tabs .cnt{font-size:11.5px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--mu)}
.ck-tabs .cnt.ok{background:rgba(34,197,94,.18);color:#86EFAC}
.ck-item{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px;border-radius:15px;background:var(--s1);border:1px solid var(--bd);margin-bottom:7px;transition:background .2s,border-color .2s}
.ck-item:active{transform:scale(.99)}
.ck-box{width:26px;height:26px;border-radius:9px;border:2px solid var(--mu2);display:grid;place-items:center;flex:none;transition:.2s;color:transparent}
.ck-item.ok{background:rgba(34,197,94,.07);border-color:rgba(34,197,94,.25)}
.ck-item.ok .ck-box{background:var(--ok);border-color:var(--ok);color:#06240F}
.ck-item .num{font-size:12px;color:var(--mu2);font-weight:700;width:16px;text-align:center;flex:none}
.ck-item .tx{flex:1;min-width:0;font-weight:620;transition:.2s}
.ck-item .tx small{display:block;color:var(--mu);font-weight:500;font-size:12.5px;margin-top:2px}
.ck-item.ok .tx{color:var(--mu);text-decoration:line-through;text-decoration-color:rgba(140,152,174,.6)}
.ck-ed{display:flex;gap:4px}
.ck-ed button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--s3);color:#C2CBDD}
.ck-ed button.d{color:#FCA5A5;background:rgba(248,113,113,.1)}
.ck-done{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(34,197,94,.16),rgba(20,184,166,.1));border:1px solid rgba(34,197,94,.35);margin-bottom:12px;animation:fade .3s ease}
.ck-done .q{width:40px;height:40px;border-radius:13px;background:var(--ok);color:#06240F;display:grid;place-items:center;flex:none}
.ck-done b{display:block}
.ck-done small{color:#BBF7D0}
.ck-add{display:flex;gap:8px;margin-top:10px}
.ck-add .inp{flex:1}
.ck-hist{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.ck-hist:last-child{border-bottom:0}
.ck-hist .d{flex:1;font-weight:620;font-size:14px}
.ck-hist .d small{display:block;color:var(--mu);font-weight:500;font-size:12px}
.pill-ok{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--s3);color:var(--mu);display:flex;align-items:center;gap:4px}
.pill-ok.ok{background:rgba(34,197,94,.15);color:#86EFAC}
.pill-ok.meio{background:rgba(251,191,36,.13);color:#FCD34D}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,14,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 8px calc(8px + var(--safe-b))}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:620;color:var(--mu2)}
#nav button .pill{width:50px;height:30px;border-radius:99px;display:grid;place-items:center;transition:.2s}
#nav button.on{color:var(--tx)}
#nav .pill{position:relative}
#nav .pill .bdg{position:absolute;top:3px;right:11px;width:9px;height:9px;border-radius:50%;background:#F43F5E;box-shadow:0 0 0 2px var(--bg)}
.upd{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(109,124,255,.2),rgba(139,92,246,.14));border:1px solid rgba(109,124,255,.45);width:100%;text-align:left;margin-bottom:10px}
.upd .q{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;flex:none}
.notas{background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;font-size:14px;color:#D3DAEA;margin-bottom:14px;max-height:40vh;overflow:auto}
.notas li{margin:0 0 6px 18px}
.notas p{margin-bottom:6px}
.ganho{color:#86EFAC;font-weight:700}
.prog{height:10px;border-radius:9px;background:var(--s3);overflow:hidden;margin:6px 0 8px}
.prog i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .25s}
#nav button.on .pill{background:rgba(109,124,255,.2);color:#C7D0FF}
#fab{position:fixed;z-index:21;right:max(18px,calc(50% - 262px));bottom:calc(84px + var(--safe-b));width:58px;height:58px;border-radius:19px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 12px 28px -10px rgba(109,124,255,.95)}
#fab svg{width:26px;height:26px}
#fab:active{transform:scale(.94)}
/* sheet */
#bg{position:fixed;inset:0;background:rgba(2,5,12,.62);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
#bg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow-y:auto;background:var(--s1);border-top-left-radius:26px;border-top-right-radius:26px;border-top:1px solid var(--bd);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:8px 18px calc(22px + var(--safe-b))}
#sheet.on{transform:none}
#sheet.cheio{height:100vh;max-height:100vh;border-radius:0}
#sheet .in{max-width:560px;margin:0 auto}
.alca{width:42px;height:5px;border-radius:9px;background:var(--bd);margin:4px auto 12px}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh-h h3{font-size:19px;font-weight:740}
.sh-h p{color:var(--mu);font-size:13px;margin-top:2px}
.campo{margin-bottom:14px}
.campo>label{display:block;font-size:12.5px;color:var(--mu);font-weight:650;margin-bottom:6px;letter-spacing:.2px}
.inp{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:13px;padding:12px 13px;outline:none}
.inp:focus{border-color:var(--pri)}
textarea.inp{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{padding:9px 13px;border-radius:12px;background:var(--s2);border:1px solid var(--bd);font-size:13.5px;font-weight:620;color:#C2CBDD;display:flex;align-items:center;gap:6px}

.seg.wd button{width:40px;justify-content:center;padding:9px 0}
.inl{display:flex;gap:8px;align-items:center}

.aviso{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:13px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.28);color:#FDE68A;font-size:13px;margin-bottom:14px}

.regra .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prev{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.prev div{border-radius:11px;background:var(--s2);text-align:center;padding:6px 0;font-size:10.5px;color:var(--mu)}
.prev div b{display:block;font-size:14px;color:var(--tx)}
.prev div.t{background:linear-gradient(160deg,var(--trab),var(--trab2));color:#DDE6FF}
.prev div.t b{color:#fff}
.prev div.t.esp{background:linear-gradient(160deg,#8B5CF6,#6D28D9)}
.lin-sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;background:var(--s2);border:1px solid var(--bd);border-radius:13px;margin-bottom:14px}
/* dialog / toast */
#dlg{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(2,5,12,.7)}
#dlg.on{display:flex}
#dlg .box{width:100%;max-width:380px;background:var(--s1);border:1px solid var(--bd);border-radius:22px;padding:20px}
#dlg h4{font-size:17px;margin-bottom:6px}
#dlg p{color:var(--mu);font-size:14px;margin-bottom:16px}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);opacity:0;z-index:70;background:#EEF2FF;color:#151A30;padding:11px 16px;border-radius:13px;font-weight:650;font-size:14px;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* onboarding */
.ob{min-height:calc(100vh - 60px);display:flex;flex-direction:column}
.ob .logo{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));margin:30px 0 20px;box-shadow:0 18px 40px -16px rgba(109,124,255,.9)}
.ob .logo svg{width:40px;height:40px;color:#fff}
.ob h2{font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
.ob p.lead{color:var(--mu);font-size:15px;margin:10px 0 24px}
.feat{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.feat .q{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--s2);color:#C7D0FF;flex:none}
.feat b{display:block}
.feat small{color:var(--mu)}
.passos{display:flex;gap:6px;margin:6px 0 18px}
.passos i{height:4px;flex:1;border-radius:9px;background:var(--bd)}
.passos i.on{background:var(--pri)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

 arrowUp:'<path d="m18 15-6-6-6 6"/>',arrowDn:'<path d="m6 9 6 6 6-6"/>',logIn:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5M15 12H3"/>',logOut:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
 shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'
};
const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}>${P[n]||''}</svg>`;

/* ============ CONSTANTES ============ */
const NAT=window.Android||null;
/* Repositório do GitHub onde as versões são publicadas (Releases) */

const TIPOS={
 servico:{nome:'Serviço extra',cor:'#F59E0B',ic:'brief',ph:'Ex.: Plantão extra no hospital X',lemb:[1440,60]},
 consulta:{nome:'Consulta médica',cor:'#EC4899',ic:'heart',ph:'Ex.: Consulta com cardiologista',lemb:[1440,120]},
 compromisso:{nome:'Compromisso',cor:'#14B8A6',ic:'pin',ph:'Ex.: Reunião, banco, curso',lemb:[60]},
 outro:{nome:'Outro',cor:'#A78BFA',ic:'star',ph:'Ex.: Aniversário',lemb:[60]}
};
const LEMB=[[0,'Na hora'],[15,'15 min'],[30,'30 min'],[60,'1 h'],[120,'2 h'],[1440,'1 dia'],[2880,'2 dias']];
const PRESETS=[
 {k:'12x36',nome:'12x36',modo:'ciclo',trab:1,folga:1,entrada:'07:00',saida:'19:00'},
 {k:'12x36n',nome:'12x36 noturno',modo:'ciclo',trab:1,folga:1,entrada:'19:00',saida:'07:00'},
 {k:'24x48',nome:'24x48',modo:'ciclo',trab:1,folga:2,entrada:'07:00',saida:'07:00'},
 {k:'24x72',nome:'24x72',modo:'ciclo',trab:1,folga:3,entrada:'07:00',saida:'07:00'},
 {k:'6x1',nome:'6x1',modo:'ciclo',trab:6,folga:1,entrada:'08:00',saida:'17:00'},
 {k:'5x2',nome:'5x2 (seg a sex)',modo:'semana',semana:[1,2,3,4,5],entrada:'08:00',saida:'17:00'},
 {k:'custom',nome:'Personalizada',modo:'ciclo',trab:2,folga:2,entrada:'07:00',saida:'19:00'}
];
const MOTIVOS=['Troca de plantão','Plantão extra','Férias','Atestado','Folga compensada','Outro'];

/* ============ DATAS ============ */
const pad=n=>String(n).padStart(2,'0');
const ds=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const hojeStr=()=>{const t=new Date();return ds(t.getFullYear(),t.getMonth()+1,t.getDate())};
const parts=s=>s.split('-').map(Number);
const dnum=s=>{const[y,m,d]=parts(s);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const fromNum=n=>{const t=new Date(n*864e5);return ds(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())};
const addD=(s,n)=>fromNum(dnum(s)+n);
const wd=s=>new Date(dnum(s)*864e5).getUTCDay();
const toMs=(s,hm)=>{const[y,m,d]=parts(s);const[h,mi]=(hm||'00:00').split(':').map(Number);return new Date(y,m-1,d,h,mi).getTime()};
const msDate=ms=>{const t=new Date(ms);return ds(t.getFullYear(),t.getMonth()+1,t.getDate())};
const fmtD=s=>{const[y,m,d]=parts(s);return `${pad(d)}/${pad(m)}/${y}`};
const fmtDC=s=>{const[,m,d]=parts(s);return `${pad(d)}/${pad(m)}`};
const fmtDL=s=>{const[,m,d]=parts(s);return `${DIAS[wd(s)]}, ${d} de ${MESES[m-1].toLowerCase()}`};
const hc=hm=>{const[h,m]=hm.split(':');return (+h)+'h'+(m!=='00'?m:'')};
const hhmm=ms=>{const t=new Date(ms);return pad(t.getHours())+':'+pad(t.getMinutes())};
const dur=min=>{min=Math.max(0,Math.round(min));const d=Math.floor(min/1440),h=Math.floor(min%1440/60),m=min%60;return d?`${d}d ${h}h`:h?`${h}h${m?' '+pad(m)+'min':''}`:`${m} min`};
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const relDia=(d,ref)=>{const h=ref?msDate(ref):hojeStr();const n=dnum(d)-dnum(h);if(n===0)return'Hoje';if(n===1)return'Amanhã';if(n===-1)return'Ontem';return `${DAB[wd(d)]}, ${fmtDC(d)}`};
const fmtLemb=m=>m===0?'na hora':m<60?m+' min antes':m<1440?(m/60)+' h antes':(m/1440)+(m===1440?' dia antes':' dias antes');

/* ============ FERIADOS ============ */
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return ds(y,mo,da)}
const ferC={};
function feriados(y){if(ferC[y])return ferC[y];const p=pascoa(y);return ferC[y]={[ds(y,1,1)]:'Confraternização Universal',[addD(p,-48)]:'Carnaval',[addD(p,-47)]:'Carnaval',[addD(p,-2)]:'Sexta-feira Santa',[p]:'Páscoa',[ds(y,4,21)]:'Tiradentes',[ds(y,5,1)]:'Dia do Trabalho',[addD(p,60)]:'Corpus Christi',[ds(y,9,7)]:'Independência do Brasil',[ds(y,10,12)]:'Nossa Senhora Aparecida',[ds(y,11,2)]:'Finados',[ds(y,11,15)]:'Proclamação da República',[ds(y,11,20)]:'Consciência Negra',[ds(y,12,25)]:'Natal'}}
const feriado=d=>S.config.feriados?feriados(parts(d)[0])[d]||null:null;

/* ============ ESTADO ============ */
const KEY='prismo_escala_v1';
function padrao(){return{versao:1,onboarding:false,nome:'',escalas:[],excecoes:{},eventos:[],checklist:ckPadrao(),checks:{},config:{feriados:true,notif:{ckEntrada:true,ckSaida:30,ativo:true,antes:60,sono:true,horasSono:8,preparo:60,vespera:true,horaVespera:'20:00',fim:false,resumo:false,horaResumo:'07:00'}}}}
let S;
function ckPadrao(){const m=a=>a.map(t=>({id:uid(),texto:t}));return{
 entrada:m(['Bater o ponto de entrada','Receber a passagem de plantão','Ler o livro de ocorrências / recados','Conferir materiais e equipamentos','Verificar uniforme e EPI']),
 saida:m(['Registrar ocorrências do plantão','Organizar o posto de trabalho','Repor materiais usados','Passar o plantão para o próximo colega','Bater o ponto de saída'])}}
function normalizar(o){const p=padrao();o=Object.assign(p,o||{});o.config=Object.assign(padrao().config,o.config||{});o.config.notif=Object.assign(padrao().config.notif,o.config.notif||{});o.escalas=o.escalas||[];o.eventos=o.eventos||[];o.excecoes=o.excecoes||{};o.checks=o.checks||{};if(!o.checklist||!Array.isArray(o.checklist.entrada))o.checklist=ckPadrao();return o}
function carregar(){let raw=null;try{if(NAT&&NAT.lerDados)raw=NAT.lerDados()}catch(e){}
 if(!raw)try{raw=localStorage.getItem(KEY)}catch(e){}
 try{S=normalizar(raw?JSON.parse(raw):null)}catch(e){S=padrao()}}
let tSalvar;
function salvar(){const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}try{NAT&&NAT.salvarDados(j)}catch(e){}
 cache.clear();clearTimeout(tSalvar);tSalvar=setTimeout(agendarNotificacoes,350)}

/* ============ LÓGICA DA ESCALA ============ */
const cache=new Map();
const escalasOrd=()=>[...S.escalas].sort((a,b)=>a.inicio<b.inicio?-1:a.inicio>b.inicio?1:0);
function escalaEm(d){let r=null;for(const e of S.escalas)if(e.inicio<=d&&(!r||e.inicio>r.inicio))r=e;return r}
function escalaAtual(){return escalaEm(hojeStr())||escalasOrd()[0]||null}
function trabalhaPela(e,d){if(e.modo==='semana')return(e.semana||[]).includes(wd(d));const t=+e.trab||1,c=t+(+e.folga||0);if(c<=0)return false;const p=((dnum(d)-dnum(e.ancora))%c+c)%c;return p<t}
function horarioPela(e,d){const w=wd(d);const r=(e.regras||[]).find(r=>(r.dias||[]).includes(w));return r?{entrada:r.entrada,saida:r.saida,especial:true}:{entrada:e.entrada,saida:e.saida,especial:false}}
function getDia(d){
 if(cache.has(d))return cache.get(d);
 const e=escalaEm(d),x=S.excecoes[d];
 const o={data:d,escala:e,trabalha:false,entrada:null,saida:null,especial:false,excecao:x||null,extra:false};
 if(e){o.trabalha=trabalhaPela(e,d);Object.assign(o,horarioPela(e,d))}
 if(x){
  if(x.tipo==='folga')o.trabalha=false;
  else{const base=e?horarioPela(e,d):{entrada:'07:00',saida:'19:00'};o.extra=!o.trabalha;o.trabalha=true;o.entrada=x.entrada||base.entrada;o.saida=x.saida||base.saida;o.especial=o.especial||x.entrada!==base.entrada||x.saida!==base.saida}
 }
 o.valor=o.trabalha&&e?(+e.valor||0):0;
 if(o.trabalha){o.ini=toMs(d,o.entrada);let f=toMs(d,o.saida);if(f<=o.ini)f=toMs(addD(d,1),o.saida);o.fim=f;o.min=(f-o.ini)/6e4;o.vira=msDate(f)!==d}
 cache.set(d,o);return o}
const descEscala=e=>{if(!e)return'';const tipo=e.modo==='semana'?(e.semana||[]).slice().sort().map(i=>DAB[i]).join(', '):`${e.trab} dia(s) de trabalho · ${e.folga} de folga`;return `${e.entrada}–${e.saida} · ${tipo}`};
function eventosDoDia(d){return S.eventos.filter(e=>d>=e.inicio&&d<=addD(e.inicio,(+e.dias||1)-1)).sort((a,b)=>{const ka=a.diaInteiro?'':a.horaIni||'',kb=b.diaInteiro?'':b.horaIni||'';return ka<kb?-1:ka>kb?1:0})}
function evIntervalo(e){const fimD=addD(e.inicio,(+e.dias||1)-1);if(e.diaInteiro)return[toMs(e.inicio,'00:00'),toMs(addD(fimD,1),'00:00')];const a=toMs(e.inicio,e.horaIni||'08:00');let b=toMs(fimD,e.horaFim||e.horaIni||'09:00');if(b<=a)b=a+36e5;return[a,b]}
function conflitos(e){const[a,b]=evIntervalo(e);const out=[];const dias=(+e.dias||1);for(let i=-1;i<dias;i++){const d=addD(e.inicio,i);const g=getDia(d);if(g.trabalha&&g.ini<b&&g.fim>a)out.push(g)}return out}
function proximoPlantao(){const now=Date.now(),h=hojeStr();for(let i=-1;i<400;i++){const g=getDia(addD(h,i));if(g.trabalha&&g.fim>now)return g}return null}

/* ============ NOTIFICAÇÕES ============ */
function hashId(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%2000000000+1}
function resumoTexto(d){const g=getDia(d),ev=eventosDoDia(d);const p=[];p.push(g.trabalha?`Plantão ${g.entrada}–${g.saida}`:'Folga');ev.forEach(e=>p.push(`${e.titulo}${e.diaInteiro?'':' '+(e.horaIni||'')}`));return p.join(' · ')}
function gerarNotificacoes(){

  const d=addD(h,i),g=getDia(d);

   if(+c.antes>0)add('a'+d,g.ini-c.antes*6e4,'plantao',`Seu plantão começa em ${dur(+c.antes)}`,`${relDia(d,g.ini-c.antes*6e4)} · ${g.entrada} às ${g.saida}${g.vira?' (termina no dia seguinte)':''}. Bom trabalho!`);

   if(+c.ckSaida>0&&ckS)add('cs'+d,g.fim-c.ckSaida*6e4,'checklist','Hora de encerrar o expediente 📋',`Faltam ${dur(+c.ckSaida)} para sair. Confira os ${ckS} itens do checklist de saída.`,'check');
   if(c.fim)add('f'+d,g.fim,'plantao','Plantão encerrado ✅','Bom descanso! Você merece.')
  }
  if(c.vespera){const t=toMs(addD(d,-1),c.horaVespera);const ev=eventosDoDia(d);if(g.trabalha||ev.length)add('v'+d,t,'resumo',g.trabalha?'Amanhã tem plantão':'Amanhã',resumoTexto(d))}
  if(c.resumo)add('r'+d,toMs(d,c.horaResumo),'resumo','Seu dia hoje',resumoTexto(d))
 }
 const lim=addD(h,120);
 S.eventos.forEach(e=>{if(e.inicio<addD(h,-3)||e.inicio>lim)return;const base=e.diaInteiro?toMs(e.inicio,'09:00'):toMs(e.inicio,e.horaIni||'08:00');const T=TIPOS[e.tipo]||TIPOS.outro;

 out.sort((a,b)=>a.t-b.t);

 // histórico

ligar.check=function(){
 const g=diaChecklist(),d=g&&g.data;
 const marcar=(ids)=>{S.checks[d]=S.checks[d]||{entrada:[],saida:[]};S.checks[d][ckAba]=ids;
  const lim=addD(hojeStr(),-120);Object.keys(S.checks).forEach(k=>{if(k<lim)delete S.checks[k]});salvar()};
 $('#ckEd').onclick=()=>{ckEdit=!ckEdit;vibrar();render()};
 document.querySelectorAll('[data-aba]').forEach(b=>b.onclick=()=>{ckAba=b.dataset.aba;render()});
 $('#ckLista').onclick=async e=>{const L=S.checklist[ckAba];const ck=e.target.closest('[data-ck]');
  if(ck&&d){vibrar();const atual=new Set(ckFeitos(d,ckAba));const id=ck.dataset.ck;atual.has(id)?atual.delete(id):atual.add(id);marcar([...atual]);
   render();if(atual.size===L.length&&atual.has(id))toast(ckAba==='entrada'?'Checklist de entrada completo! 💪':'Expediente encerrado! 🏠');return}
  const up=e.target.closest('[data-up]'),dn=e.target.closest('[data-dn]'),ed=e.target.closest('[data-ed]'),del=e.target.closest('[data-del]');
  if(up){const i=+up.dataset.up;if(i>0){[L[i-1],L[i]]=[L[i],L[i-1]];salvar();render()}}
  if(dn){const i=+dn.dataset.dn;if(i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]];salvar();render()}}
  if(ed){const i=+ed.dataset.ed;editarItem(L[i])}
  if(del){const i=+del.dataset.del;if(await confirmar('Excluir item?',`"${esc(L[i].texto)}"`,'Excluir',true)){L.splice(i,1);salvar();render()}}};
 const add=()=>{const v=$('#ckNovo').value.trim();if(!v)return;S.checklist[ckAba].push({id:uid(),texto:v});salvar();render();setTimeout(()=>{const n=$('#ckNovo');n&&n.focus()},50)};
 $('#ckAdd')&&($('#ckAdd').onclick=add);$('#ckNovo')&&($('#ckNovo').onkeydown=e=>{if(e.key==='Enter')add()});
 $('#ckReset')&&($('#ckReset').onclick=async()=>{if(await confirmar('Restaurar lista sugerida?','A lista de entrada e de saída voltará ao padrão.','Restaurar')){S.checklist=ckPadrao();salvar();render()}});
 $('#ckTodos')&&($('#ckTodos').onclick=()=>{marcar(S.checklist[ckAba].map(i=>i.id));vibrar();render();toast(ckAba==='entrada'?'Checklist de entrada completo! 💪':'Expediente encerrado! 🏠')});

function editarItem(it){abrirSheet(`<div class="alca"></div><div class="sh-h"><div><h3>Editar item</h3><p>Checklist de ${ckAba==='entrada'?'entrada':'saída'}</p></div><button class="btn-ic" id="xI">${ic('x')}</button></div>

function telaResumo(){
 const s=statsMes(rY,rM);let pm=rM-1,py=rY;if(pm<1){pm=12;py--}const sp=statsMes(py,pm);const dif=Math.round((s.min-sp.min)/60);
 const servs=S.eventos.filter(e=>e.tipo==='servico'&&e.inicio>=ds(rY,rM,1)&&e.inicio<=ds(rY,rM,s.dim)).sort((a,b)=>a.inicio<b.inicio?-1:1);
 // semanas
 const h=hojeStr(),ini=addD(h,-wd(h));let barras='';for(let i=0;i<7;i++){const d=addD(ini,i),g=getDia(d);const pct=g.trabalha?Math.min(100,g.min/24*100/60*1):0;barras+=`<div class="sb"><i><em style="height:${pct}%"></em></i>${DC[i]}<br>${g.trabalha?Math.round(g.min/60)+'h':'–'}</div>`}
 return `<div><div class="topo"><div><h1>Resumo</h1><div class="sub">${MESES[rM-1]} de ${rY}</div></div><div style="display:flex;gap:6px"><button class="btn-ic" id="rAnt">${ic('chevL')}</button><button class="btn-ic" id="rProx">${ic('chevR')}</button></div></div>
 <div class="big-card"><div class="l">Horas de plantão no mês</div><div class="v">${Math.round(s.min/60)}h${s.min%60?' '+Math.round(s.min%60)+'min':''}</div><div class="c">${s.t} plantões · ${s.folgas} folgas${dif?` · ${dif>0?'+':''}${dif}h vs ${MESES[pm-1].toLowerCase()}`:''}</div></div>
 ${s.ganho||s.val?`<div class="big-card" style="background:linear-gradient(135deg,#0F2A22,#13203F);border-color:rgba(34,197,94,.3)"><div class="l" style="color:#86EFAC">Previsão de ganhos no mês</div><div class="v">${brl(s.ganho+s.val)}</div><div class="c">Plantões ${brl(s.ganho)} · Extras ${brl(s.val)}</div>
 ${s.ganho?`<div class="bar" style="margin-top:12px"><i style="width:${(s.ganhoAte/s.ganho*100).toFixed(1)}%"></i></div><div class="c" style="margin-top:6px">Já trabalhado: ${brl(s.ganhoAte)} (${s.tAte} de ${s.t} plantões)</div>`:''}</div>`
 :`<div class="aviso info">${ic('money')}<div>Defina quanto vale cada plantão em <b>Ajustes › Ganho por plantão</b> para ver a previsão de ganhos.</div></div>`}
 <div class="g2"><div class="mini"><div class="l">${ic('money',15)} Extras do mês</div><div class="v">${brl(s.val)}</div></div><div class="mini"><div class="l">${ic('check',15)} Já recebido</div><div class="v" style="color:#86EFAC">${brl(s.rec)}</div></div>
 <div class="mini"><div class="l">${ic('brief',15)} Serviços extras</div><div class="v">${s.evs.servico||0}</div></div><div class="mini"><div class="l">${ic('heart',15)} Consultas</div><div class="v">${s.evs.consulta||0}</div></div>
 <div class="mini"><div class="l">${ic('zap',15)} Horário especial</div><div class="v">${s.esp}</div></div><div class="mini"><div class="l">${ic('edit',15)} Dias ajustados</div><div class="v">${s.aj}</div></div></div>
 <div class="sec-t">Esta semana</div><div class="card"><div class="semana-bar">${barras}</div></div>
 <div class="sec-t">Serviços extras do mês</div>
 ${servs.length?servs.map(e=>`<button class="ev" data-ev="${e.id}"><span class="bar-l" style="background:#F59E0B"></span><div><div class="t">${esc(e.titulo)}</div><div class="m">${fmtD(e.inicio)}${(+e.dias||1)>1?` · ${e.dias} dias`:''}</div></div><div class="v" style="color:${e.pago?'#86EFAC':'#FCD34D'}">${brl(e.valor)}<small>${e.pago?'Recebido':'A receber · toque p/ marcar'}</small></div></button>`).join(''):`<div class="card" style="color:var(--mu);text-align:center">Nenhum serviço extra neste mês</div>`}</div>`}

/* ============ FORM: ESCALA ============ */
let F=null;
function formEscala(modo,inicio,base){
 const b=base||escalaAtual()||PRESETS[0];
 F={modo,id:base?base.id:uid(),preset:base?base.preset||'custom':(b.preset||'12x36'),nome:b.nome||'12x36',tipo:b.modo||'ciclo',trab:b.trab||1,folga:b.folga??1,semana:(b.semana||[1,2,3,4,5]).slice(),entrada:b.entrada||'07:00',saida:b.saida||'19:00',
  regras:JSON.parse(JSON.stringify(b.regras||[])),valor:b.valor||'',inicio:base?base.inicio:(inicio||hojeStr()),ancora:base?base.ancora||base.inicio:(inicio||hojeStr())};
 if(modo==='primeira'||modo==='onboarding'){F.ancora=hojeStr();F.inicio=hojeStr();F.semInicio=true}
 if(base&&escalasOrd()[0]&&escalasOrd()[0].id===base.id&&base.inicio<='2020-01-01')F.semInicio=true;
 desenharEscala()}
function desenharEscala(){
 const ed=F.modo==='editar',pri=F.modo==='onboarding'||F.modo==='primeira',primeiraEsc=ed&&escalasOrd()[0]&&escalasOrd()[0].id===F.id;
 const tit=pri?'Sua escala':ed?'Editar escala':'Nova escala';
 const sub=pri?'Configure como você trabalha':ed?'Altera esta escala em todo o período dela':`Os dias antes de ${fmtD(F.inicio)} continuam com a escala antiga`;
 const html=`${F.modo==='onboarding'?'<div class="passos"><i class="on"></i><i class="on"></i><i></i></div>':'<div class="alca"></div>'}
 <div class="sh-h"><div><h3>${tit}</h3><p>${sub}</p></div>${F.modo!=='onboarding'?`<button class="btn-ic" id="xF">${ic('x')}</button>`:''}</div>
 <div class="campo"><label>Tipo de escala</label><div class="seg" id="presets">${PRESETS.map(p=>`<button data-p="${p.k}" class="${F.preset===p.k?'on':''}">${p.nome}</button>`).join('')}</div></div>
 ${F.tipo==='ciclo'?`${F.preset==='custom'?`<div class="row2"><div class="campo"><label>Dias trabalhando</label><input class="inp" type="number" min="1" max="30" id="fTrab" value="${F.trab}"></div><div class="campo"><label>Dias de folga</label><input class="inp" type="number" min="0" max="30" id="fFolga" value="${F.folga}"></div></div>`:''}
 <div class="campo"><label>${pri?'Um dia que você trabalha (passado, hoje ou futuro)':'Data de um plantão nesta escala'}</label><div class="inl"><input class="inp" type="date" id="fAnc" value="${F.ancora}"><button class="btn sm" data-anc="0">Hoje</button><button class="btn sm" data-anc="1">Amanhã</button></div></div>`
 :`<div class="campo"><label>Dias de trabalho</label><div class="seg wd" id="fSem">${DC.map((l,i)=>`<button data-w="${i}" class="${F.semana.includes(i)?'on':''}">${l}</button>`).join('')}</div></div>`}
 <div class="row2"><div class="campo"><label>Entrada</label><input class="inp" type="time" id="fEnt" value="${F.entrada}"></div><div class="campo"><label>Saída</label><input class="inp" type="time" id="fSai" value="${F.saida}"></div></div>
 ${(F.saida<=F.entrada)?`<div class="aviso info" style="margin-top:-4px">${ic('moon')}<div>A saída é no dia seguinte (${dur(((mins(F.saida)-mins(F.entrada)+1440)%1440||1440))} de plantão).</div></div>`:''}
 <div class="campo"><label>Horários especiais por dia da semana</label>
 <p style="color:var(--mu);font-size:12.5px;margin:-2px 0 8px">Ex.: quando o plantão cair na sexta ou sábado, entrar 08:00 e sair 20:00.</p>
 <div id="regras">${F.regras.map((r,i)=>`<div class="regra"><div class="top"><div class="seg wd">${DC.map((l,w)=>`<button data-rw="${i}:${w}" class="${r.dias.includes(w)?'on':''}" style="width:34px">${l}</button>`).join('')}</div><button class="btn-ic" data-rdel="${i}" style="width:34px;height:34px">${ic('trash',16)}</button></div>
 <div class="row2"><input class="inp" type="time" data-re="${i}" value="${r.entrada}"><input class="inp" type="time" data-rs="${i}" value="${r.saida}"></div></div>`).join('')}</div>
 <button class="btn full sm" id="addRegra">${ic('plus',16)} Adicionar horário especial</button></div>
 <div class="campo"><label>Ganho por plantão (R$)</label><input class="inp" type="number" inputmode="decimal" step="0.01" id="fVal" value="${F.valor}" placeholder="Opcional — ex.: 180,00"><p style="color:var(--mu);font-size:12px;margin-top:5px">Usado na previsão de ganhos de cada dia trabalhado.</p></div>
 ${pri||primeiraEsc?`<div class="campo"><label>Quando você começou a trabalhar nesta escala?</label>
 <div class="seg" id="fSemIni" style="margin-bottom:8px"><button data-si="1" class="${F.semInicio?'on':''}">Não sei / sempre</button><button data-si="0" class="${F.semInicio?'':'on'}">Escolher data</button></div>
 ${F.semInicio?'':`<input class="inp" type="date" id="fIni" value="${F.inicio}"><p style="color:var(--mu);font-size:12px;margin-top:5px">Antes dessa data o calendário fica sem escala.</p>`}</div>`
 :`<div class="campo"><label>${ed?'Vale a partir de':'Nova escala começa em'}</label><input class="inp" type="date" id="fIni" value="${F.inicio}"></div>`}
 <div class="campo"><label>Prévia dos próximos dias</label><div class="prev" id="prev"></div></div>
 <button class="btn pri full" id="salvaF">${ic('check',18)} ${pri?'Continuar':'Salvar escala'}</button>
 ${ed&&S.escalas.length>1?`<button class="btn dan full" id="delF" style="margin-top:8px">${ic('trash',18)} Excluir esta escala</button>`:''}`;
 if(sheetAberto&&$('#sheetIn').dataset.f==='esc'){const st=$('#sheet').scrollTop;$('#sheetIn').innerHTML=html;$('#sheet').scrollTop=st}else{abrirSheet(html,{cheio:F.modo==='onboarding'});}
 $('#sheetIn').dataset.f='esc';atualizarPrevia();ligarEscala()}
const mins=hm=>{const[h,m]=hm.split(':').map(Number);return h*60+m};
function escalaDeF(){return{id:F.id,preset:F.preset,nome:F.nome,modo:F.tipo,trab:+F.trab||1,folga:Math.max(0,+F.folga||0),semana:F.semana.slice(),entrada:F.entrada,saida:F.saida,regras:F.regras.filter(r=>r.dias.length),valor:+String(F.valor).replace(',','.')||0,inicio:F.semInicio?(F.ancora<'2020-01-01'?F.ancora:'2020-01-01'):F.inicio,ancora:F.ancora}}
function atualizarPrevia(){const e=escalaDeF();const ini=F.modo==='novo'||(!F.semInicio&&F.inicio>hojeStr())?F.inicio:hojeStr();let h='';
 for(let i=0;i<14;i++){const d=addD(ini,i),t=trabalhaPela(e,d),hr=horarioPela(e,d);h+=`<div class="${t?'t':''} ${t&&hr.especial?'esp':''}">${DAB[wd(d)]}<b>${parts(d)[2]}</b>${t?hc(hr.entrada):'folga'}</div>`}
 const p=$('#prev');p&&(p.innerHTML=h)}
function ligarEscala(){
 const r=()=>desenharEscala(),on=(id,ev,fn)=>{const el=$('#'+id);el&&el.addEventListener(ev,fn)};
 on('xF','click',fecharSheet);
 $('#presets').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=PRESETS.find(x=>x.k===b.dataset.p);if(F.preset!==p.k)F.regras=[];F.preset=p.k;F.nome=p.nome;F.tipo=p.modo;if(p.trab)F.trab=p.trab;if(p.folga!==undefined)F.folga=p.folga;if(p.semana)F.semana=p.semana.slice();F.entrada=p.entrada;F.saida=p.saida;r()};
 on('fTrab','input',e=>{F.trab=Math.max(1,+e.target.value||1);F.nome=`${F.trab}x${F.folga} (dias)`;atualizarPrevia()});
 on('fFolga','input',e=>{F.folga=Math.max(0,+e.target.value||0);F.nome=`${F.trab}x${F.folga} (dias)`;atualizarPrevia()});
 on('fAnc','change',e=>{if(e.target.value){F.ancora=e.target.value;atualizarPrevia()}});
 document.querySelectorAll('[data-anc]').forEach(b=>b.onclick=()=>{F.ancora=addD(hojeStr(),+b.dataset.anc);$('#fAnc').value=F.ancora;atualizarPrevia()});
 const sem=$('#fSem');sem&&(sem.onclick=e=>{const b=e.target.closest('[data-w]');if(!b)return;const w=+b.dataset.w;F.semana=F.semana.includes(w)?F.semana.filter(x=>x!==w):[...F.semana,w];b.classList.toggle('on');atualizarPrevia()});
 on('fEnt','change',e=>{F.entrada=e.target.value||'07:00';r()});on('fSai','change',e=>{F.saida=e.target.value||'19:00';r()});
 on('fIni','change',e=>{if(e.target.value){F.inicio=e.target.value;if(F.modo==='novo'&&F.tipo==='ciclo'&&F.ancora<F.inicio){}r()}});
 on('fVal','input',e=>F.valor=e.target.value);
 const si=$('#fSemIni');si&&(si.onclick=e=>{const b=e.target.closest('[data-si]');if(!b)return;F.semInicio=b.dataset.si==='1';if(!F.semInicio&&F.inicio<='2020-01-01')F.inicio=F.ancora;r()});
 on('addRegra','click',()=>{F.regras.push({dias:[5,6],entrada:F.entrada,saida:F.saida});r()});
 const rg=$('#regras');rg.onclick=e=>{const w=e.target.closest('[data-rw]'),d=e.target.closest('[data-rdel]');
  if(w){const[i,x]=w.dataset.rw.split(':').map(Number);const R=F.regras[i];
   F.regras.forEach((o,j)=>{if(j!==i)o.dias=o.dias.filter(z=>z!==x)});
   R.dias=R.dias.includes(x)?R.dias.filter(z=>z!==x):[...R.dias,x];r()}
  if(d){F.regras.splice(+d.dataset.rdel,1);r()}};
 rg.onchange=e=>{const t=e.target;if(t.dataset.re!==undefined)F.regras[+t.dataset.re].entrada=t.value||F.entrada;if(t.dataset.rs!==undefined)F.regras[+t.dataset.rs].saida=t.value||F.saida;atualizarPrevia()};
 on('salvaF','click',salvarEscala);
 on('delF','click',async()=>{if(await confirmar('Excluir escala?','Os dias desse período passam a seguir a escala anterior.','Excluir',true)){S.escalas=S.escalas.filter(e=>e.id!==F.id);salvar();fecharSheet();render();toast('Escala excluída')}})}
function salvarEscala(){
 if(F.tipo==='semana'&&!F.semana.length)return toast('Escolha ao menos um dia de trabalho');
 if(F.regras.some(r=>!r.dias.length))F.regras=F.regras.filter(r=>r.dias.length);
 const e=escalaDeF();
 if(F.modo==='editar'){const i=S.escalas.findIndex(x=>x.id===F.id);if(i>=0)S.escalas[i]=e}
 else if(F.modo==='novo'){const ex=S.escalas.findIndex(x=>x.inicio===e.inicio);if(ex>=0)S.escalas[ex]=e;else S.escalas.push(e)}
 else{S.escalas=[e]}
 salvar();vibrar();
 if(F.modo==='onboarding'){return obNotif()}
 fecharSheet();sel=F.modo==='novo'?e.inicio:sel;if(F.modo==='novo'){[vY,vM]=parts(e.inicio);tab='cal'}render();
 toast(F.modo==='novo'?`Nova escala a partir de ${fmtD(e.inicio)}`:'Escala salva')}

 const html=`<div class="alca"></div><div class="sh-h"><div><h3>${E.novo?'Novo evento':'Editar evento'}</h3><p>${fmtDL(E.inicio)}</p></div><button class="btn-ic" id="xE">${ic('x')}</button></div>

 ${E.diaInteiro?'':`<div class="row2"><div class="campo"><label>Início${+E.dias>1?' (1º dia)':''}</label><input class="inp" type="time" id="eHI" value="${E.horaIni}"></div><div class="campo"><label>Fim${+E.dias>1?' (último dia)':''}</label><input class="inp" type="time" id="eHF" value="${E.horaFim}"></div></div>`}

/* ============ FORM: AJUSTAR DIA ============ */
let A=null;
function formAjuste(d){const g=getDia(d),x=S.excecoes[d],e=escalaEm(d);const base=e?horarioPela(e,d):{entrada:'07:00',saida:'19:00'};
 A={d,tipo:x?(x.tipo==='folga'?'folga':'trabalho'):'escala',entrada:x&&x.entrada||base.entrada,saida:x&&x.saida||base.saida,nota:x&&x.nota||'',ate:d,padrao:g.trabalha?'trabalho':'folga'};desenharAjuste()}
function desenharAjuste(){
 const html=`<div class="alca"></div><div class="sh-h"><div><h3>Ajustar dia</h3><p>${fmtDL(A.d)} · pela escala: ${A.padrao==='trabalho'?'plantão':'folga'}</p></div><button class="btn-ic" id="xA">${ic('x')}</button></div>
 <div class="campo"><label>Neste dia</label><div class="seg" id="aTipo"><button data-a="escala" class="${A.tipo==='escala'?'on':''}">${ic('repeat',15)} Seguir escala</button><button data-a="folga" class="${A.tipo==='folga'?'on':''}">${ic('coffee',15)} Folga</button><button data-a="trabalho" class="${A.tipo==='trabalho'?'on':''}">${ic('brief',15)} Trabalhar</button></div></div>
 ${A.tipo==='trabalho'?`<div class="row2"><div class="campo"><label>Entrada</label><input class="inp" type="time" id="aEnt" value="${A.entrada}"></div><div class="campo"><label>Saída</label><input class="inp" type="time" id="aSai" value="${A.saida}"></div></div>`:''}
 ${A.tipo!=='escala'?`<div class="campo"><label>Motivo</label><div class="seg" id="aMot">${MOTIVOS.map(m=>`<button data-m="${m}" class="${A.nota===m?'on':''}">${m}</button>`).join('')}</div><input class="inp" id="aNota" value="${esc(A.nota)}" placeholder="Descreva (opcional)" style="margin-top:8px"></div>
 <div class="campo"><label>Repetir até (ex.: férias)</label><input class="inp" type="date" id="aAte" value="${A.ate}" min="${A.d}"></div>`:''}
 <button class="btn pri full" id="aSalva">${ic('check',18)} Salvar</button>`;
 if(sheetAberto&&$('#sheetIn').dataset.f==='aj')$('#sheetIn').innerHTML=html;else abrirSheet(html);$('#sheetIn').dataset.f='aj';
 const on=(id,ev,fn)=>{const el=$('#'+id);el&&el.addEventListener(ev,fn)};
 on('xA','click',fecharSheet);
 $('#aTipo').onclick=e=>{const b=e.target.closest('[data-a]');if(b){A.tipo=b.dataset.a;desenharAjuste()}};
 on('aEnt','change',e=>A.entrada=e.target.value||A.entrada);on('aSai','change',e=>A.saida=e.target.value||A.saida);
 const mot=$('#aMot');mot&&(mot.onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;A.nota=b.dataset.m;$('#aNota').value=A.nota;mot.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
 on('aNota','input',e=>A.nota=e.target.value);on('aAte','change',e=>A.ate=e.target.value&&e.target.value>=A.d?e.target.value:A.d);
 on('aSalva','click',()=>{const n=Math.min(366,dnum(A.ate)-dnum(A.d));for(let i=0;i<=n;i++){const d=addD(A.d,i);
   if(A.tipo==='escala')delete S.excecoes[d];else if(A.tipo==='folga')S.excecoes[d]={tipo:'folga',nota:A.nota};
   else{const e=escalaEm(d);const base=e?horarioPela(e,d):{};const vaiTrab=e?trabalhaPela(e,d):false;
    // num período, aplica 'trabalho' só ao 1º dia ou a todos
    S.excecoes[d]={tipo:'trabalho',entrada:A.entrada,saida:A.saida,nota:A.nota}}}
  salvar();vibrar();fecharSheet();render();toast(A.tipo==='escala'?'Dia voltou a seguir a escala':n?`${n+1} dias ajustados`:'Dia ajustado')})}

/* ============ BACKUP ============ */
function exportar(){const j=JSON.stringify(S,null,1),nome=`prismo-escala-${hojeStr()}.json`;
 if(NAT&&NAT.exportar){NAT.exportar(j,nome);return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=nome;a.click();toast('Backup exportado')}
function importar(){if(NAT&&NAT.importar){NAT.importar();return}$('#arq').click()}
$('#arq').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>window.importarBackup(r.result);r.readAsText(f);e.target.value=''};
window.importarBackup=async function(txt){try{const o=JSON.parse(txt);if(!o||!Array.isArray(o.escalas))throw 0;
 if(await confirmar('Restaurar backup?',`${o.escalas.length} escala(s) e ${(o.eventos||[]).length} evento(s). Os dados atuais serão substituídos.`,'Restaurar')){S=normalizar(o);S.onboarding=true;salvar();render();toast('Backup restaurado')}}catch(e){toast('Arquivo de backup inválido')}};
window.aoExportar=ok=>toast(ok?'Backup salvo':'Não foi possível salvar');

/* ============ ONBOARDING ============ */
function obInicio(){abrirSheet(`<div class="ob"><div class="passos"><i class="on"></i><i></i><i></i></div><div class="logo">${ic('cal')}</div>
 <h2>Sua escala,<br>sempre no controle.</h2><p class="lead">Calendário 12x36 (e outras escalas), serviços extras, consultas e lembretes para você nunca dormir tarde antes do plantão.</p>
 <div class="feat"><span class="q">${ic('repeat',18)}</span><div><b>Escala automática</b><br><small>Mude quando quiser — o histórico antigo fica guardado.</small></div></div>
 <div class="feat"><span class="q">${ic('zap',18)}</span><div><b>Horários especiais</b><br><small>Sexta e sábado com outro horário? Configure uma vez.</small></div></div>
 <div class="feat"><span class="q">${ic('moon',18)}</span><div><b>Alerta de sono</b><br><small>Avisa a hora certa de deitar na véspera.</small></div></div>
 <div class="campo" style="margin-top:10px"><label>Como podemos te chamar?</label><input class="inp" id="obNome" placeholder="Seu nome (opcional)" value="${esc(S.nome)}"></div>
 <div style="margin-top:auto"><button class="btn pri full" id="obGo">Começar ${ic('chevR',18)}</button></div></div>`,{cheio:true});
 $('#obGo').onclick=()=>{S.nome=$('#obNome').value.trim();formEscala('onboarding')}}
function obNotif(){$('#sheetIn').dataset.f='';$('#sheetIn').innerHTML=`<div class="ob fade"><div class="passos"><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="logo">${ic('bell')}</div>
 <h2>Ative os avisos</h2><p class="lead">Para lembrar do plantão, da hora de dormir e dos seus compromissos, mesmo com o app fechado.</p>
 <div class="lista" id="obPerm"></div>
 <div style="margin-top:auto;padding-top:20px"><button class="btn pri full" id="obFim">${ic('check',18)} Tudo pronto</button></div></div>`;$('#sheet').scrollTop=0;desenharPermOb();
 $('#obFim').onclick=()=>{S.onboarding=true;salvar();fecharSheet();const t=new Date();vY=t.getFullYear();vM=t.getMonth()+1;sel=hojeStr();render();toast('Escala configurada!')}}
function desenharPermOb(){const el=$('#obPerm');if(!el)return;const p=statusPerm();
 el.innerHTML=`<button class="item" data-op="n"><span class="ok-dot ${p.notif?'':'no'}"></span><div class="tx"><b>Notificações</b><small>${p.notif?'Permitidas ✓':'Toque para permitir'}</small></div></button>
 <button class="item" data-op="x"><span class="ok-dot ${p.exato?'':'no'}"></span><div class="tx"><b>Alarmes no horário exato</b><small>${p.exato?'Permitido ✓':'Toque para permitir'}</small></div></button>
 <button class="item" data-op="b"><span class="ok-dot ${p.bat?'':'no'}"></span><div class="tx"><b>Bateria sem restrição</b><small>${p.bat?'Liberado ✓':'Evita que o sistema bloqueie os avisos'}</small></div></button>`;
 el.onclick=e=>{const b=e.target.closest('[data-op]');if(!b||!NAT)return;try{({n:()=>NAT.pedirPermissaoNotificacao(),x:()=>NAT.abrirAlarmesExatos(),b:()=>NAT.pedirSemOtimizacao()})[b.dataset.op]()}catch(err){}}}

/* ============ ATUALIZAÇÕES ============ */
let atu=null,atuManual=false,atuBaixando=false,atuEsperaPerm=false;
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
function versaoApp(){try{return NAT&&NAT.versao?NAT.versao():'1.2'}catch(e){return'1.2'}}
function textoUltimaVerif(){const t=+LS('atu_ultima')||0;if(!t)return'nunca verificado';const m=(Date.now()-t)/6e4;return m<2?'verificado agora':m<60?`verificado há ${Math.round(m)} min`:m<1440?`verificado há ${Math.round(m/60)} h`:`verificado em ${fmtD(msDate(t))}`}
function marcarBadge(){const p=document.querySelector('#nav [data-t="ajustes"] .pill');if(!p)return;let b=p.querySelector('.bdg');const on=!!(atu&&atu.nova);if(on&&!b){b=document.createElement('i');b.className='bdg';p.appendChild(b)}if(!on&&b)b.remove()}
function checarAtualizacao(manual){atuManual=!!manual;
 if(!NAT||!NAT.verificarAtualizacao){if(manual)toast('Disponível no app instalado');return}
 if(manual)toast('Procurando atualizações…');try{NAT.verificarAtualizacao(REPO)}catch(e){}}
window.aoAtualizacao=function(r){
 const manual=atuManual;atuManual=false;
 if(!r||!r.ok){if(manual)toast('Não foi possível verificar. Confira sua internet.');return}
 LS('atu_ultima',String(Date.now()));atu=r;marcarBadge();
 if(r.nova){if(manual||LS('atu_ignorada')!==r.versao)popupAtualizacao(r)}
 else if(manual)toast(`Você já está na versão mais recente (${versaoApp()})`);
 if(tab==='ajustes'&&!sheetAberto)render()};
function notasHTML(t){t=String(t||'').trim();if(!t)return'<p>Melhorias e correções.</p>';let h='',ul=false;
 t.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l){if(ul){h+='</ul>';ul=false}return}const b=l.match(/^[-*•]\s+(.*)/);
  const fmt=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  if(b){if(!ul){h+='<ul>';ul=true}h+=`<li>${fmt(b[1])}</li>`}else{if(ul){h+='</ul>';ul=false}h+=/^#+\s/.test(l)?`<p><b>${fmt(l.replace(/^#+\s*/,''))}</b></p>`:`<p>${fmt(l)}</p>`}});
 return h+(ul?'</ul>':'')}
function popupAtualizacao(r){if(!r)return;const mb=r.tamanho?` · ${(r.tamanho/1048576).toFixed(1)} MB`:'';
 abrirSheet(`<div class="alca"></div><div class="sh-h"><div><h3>Nova versão disponível</h3><p>Versão ${esc(r.versao)}${mb} · você está na ${versaoApp()}</p></div><button class="btn-ic" id="xU">${ic('x')}</button></div>
 <div class="notas">${notasHTML(r.notas)}</div>
 <div id="uArea"><button class="btn pri full" id="uGo">${ic('down',18)} Atualizar agora</button><button class="btn full" id="uDepois" style="margin-top:8px">Agora não</button></div>
 <p style="color:var(--mu2);font-size:12px;text-align:center;margin-top:12px">Seus dados (escalas, eventos e checklist) são mantidos.</p>`);
 $('#sheetIn').dataset.f='upd';
 $('#xU').onclick=fecharSheet;$('#uDepois').onclick=()=>{LS('atu_ignorada',r.versao);fecharSheet()};
 $('#uGo').onclick=()=>iniciarAtualizacao(r)}
function iniciarAtualizacao(r){if(!NAT||!NAT.atualizar)return toast('Disponível no app instalado');
 let pode=true;try{pode=NAT.podeInstalar()}catch(e){}
 if(!pode){atuEsperaPerm=true;$('#uArea').innerHTML=`<div class="aviso info">${ic('shield')}<div>Para instalar a atualização, permita que o <b>Prismo Escala</b> instale apps. É só ativar a opção e voltar para cá.</div></div><button class="btn pri full" id="uPerm">${ic('shield',18)} Permitir instalação</button>`;
  $('#uPerm').onclick=()=>{try{NAT.abrirPermissaoInstalar()}catch(e){}};return}
 atuEsperaPerm=false;atuBaixando=true;
 $('#uArea').innerHTML=`<div style="display:flex;justify-content:space-between;font-size:13.5px;color:var(--mu)"><span id="uTxt">Baixando atualização…</span><b id="uPct">0%</b></div><div class="prog"><i id="uBar"></i></div>`;
 try{NAT.atualizar(r.url)}catch(e){atuBaixando=false;toast('Erro ao iniciar o download')}}
window.aoProgressoAtualizacao=p=>{const b=$('#uBar');if(b)b.style.width=p+'%';const t=$('#uPct');t&&(t.textContent=p+'%');if(p>=100){const x=$('#uTxt');x&&(x.textContent='Abrindo o instalador…')}};
window.aoErroAtualizacao=m=>{atuBaixando=false;toast(m||'Falha ao atualizar');const a=$('#uArea');if(a&&atu)a.innerHTML=`<button class="btn pri full" id="uGo">${ic('repeat',18)} Tentar de novo</button>`,$('#uGo').onclick=()=>iniciarAtualizacao(atu)};
function autoChecar(){if(!NAT||S.config.autoAtualizar===false||!S.onboarding)return;const t=+LS('atu_ultima')||0;if(Date.now()-t>6*36e5)setTimeout(()=>checarAtualizacao(false),1500)}

/* ============ CALLBACKS NATIVOS ============ */
window.aoPermissao=()=>{desenharPermOb();if(tab==='ajustes'&&!sheetAberto)render()};
window.abrirAba=a=>{if(!S.onboarding)return;if(sheetAberto)fecharSheet();tab=a||'cal';window.scrollTo(0,0);render()};
window.aoVoltarAoApp=()=>{cache.clear();if(atuEsperaPerm&&atu&&sheetAberto&&$('#sheetIn').dataset.f==='upd'){let ok=false;try{ok=NAT.podeInstalar()}catch(e){}if(ok)iniciarAtualizacao(atu);return}if(atuBaixando)return;desenharPermOb();if(!sheetAberto)render();agendarNotificacoes()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!NAT)window.aoVoltarAoApp()});

/* ============ INÍCIO ============ */
carregar();
{const t=new Date();vY=rY=t.getFullYear();vM=rM=t.getMonth()+1}
render();
if(!S.onboarding||!S.escalas.length){S.onboarding=false;obInicio()}else{agendarNotificacoes();autoChecar()}
</script>
</body>
</html>
