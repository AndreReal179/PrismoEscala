name: Gerar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar projeto
        run: |
          ARQ=$(find . -name settings.gradle.kts -not -path "*/build/*" | head -n 1)
          if [ -z "$ARQ" ]; then
            echo "settings.gradle.kts não encontrado no repositório. Arquivos enviados:"
            find . -maxdepth 3 -not -path "./.git*" | head -50
            exit 1
          fi
          DIR=$(dirname "$ARQ")
          echo "Projeto encontrado em: $DIR"
          echo "PROJ=$DIR" >> $GITHUB_ENV

      - name: Compilar APK
        run: |
          cd "$PROJ"
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PrismoEscala.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PrismoEscala-APK
          path: PrismoEscala.apk
